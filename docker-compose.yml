# Local dev stack: Postgres + LocalStack (SNS/SQS) + the service itself.
#
# Usage:
#   docker compose up --build
#
# The app creates its own topic/queues/subscriptions/DLQ on startup (see
# TopologyBootstrapper) — there's no separate AWS setup step needed.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: event-fanout-postgres
    environment:
      POSTGRES_DB: event_fanout
      POSTGRES_USER: event_fanout
      POSTGRES_PASSWORD: event_fanout
    ports:
      - "5435:5432"
    volumes:
      - event_fanout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_fanout"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7
    container_name: event-fanout-localstack
    environment:
      SERVICES: sns,sqs
      DEBUG: 0
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: event-fanout-app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/event_fanout
      DB_USER: event_fanout
      DB_PASSWORD: event_fanout
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      # Remote debugging: the JVM listens on 5005 inside the container and the
      # app starts normally (suspend=n), so nothing blocks waiting for a
      # debugger. Attach from the IDE to localhost:5006. Drop this line to run
      # without the debug agent.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005}
    ports:
      - "8081:8081"
      - "5006:5005"

volumes:
  event_fanout_pgdata:
